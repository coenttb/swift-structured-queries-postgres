# SwiftLint configuration
# Inherits from the shared parent configuration in swift-standards

parent_config: https://raw.githubusercontent.com/swift-compositions/.github/main/.swiftlint.yml

# Package-specific overrides (if needed)
disabled_rules:
  - function_name_whitespace  # Conflicts with swift-format line breaking of long backtick test names
  - force_cast  # Generic-dispatch bridging (opened `some Root`/`Value` existentials in the
                # query-building core) is provably safe by the surrounding generic constraints;
                # rewriting ~20 call sites in StructuredQueriesCore/StructuredQueriesPostgres
                # internals is a semantic change to vendored query-builder machinery, not a
                # mechanical lint fix.
